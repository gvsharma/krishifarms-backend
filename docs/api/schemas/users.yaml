UserSelfUpdateRequest:
  type: object
  properties:
    full_name:
      type: string
      minLength: 2
      maxLength: 200
    preferred_locale:
      type: string
      minLength: 2
      maxLength: 10
      example: te

SessionResponse:
  type: object
  required: [id, created_at, expires_at]
  properties:
    id:
      type: string
      format: uuid
    device_id:
      type: string
      nullable: true
      maxLength: 100
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time

SessionListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/SessionResponse'

SessionListAPIResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/SessionListResponse'
    meta:
      $ref: 'common.yaml#/Meta'

UserResponse:
  type: object
  required: [id, org_id, full_name, preferred_locale, is_active, role, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    org_id:
      type: string
      format: uuid
    email:
      type: string
      nullable: true
      description: May include seeded *.local demo addresses (not strict RFC EmailStr)
    phone:
      type: string
      nullable: true
    full_name:
      type: string
    village_id:
      type: string
      format: uuid
      nullable: true
    preferred_locale:
      type: string
    is_active:
      type: boolean
    role:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    last_login_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserAPIResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/UserResponse'
    meta:
      $ref: 'common.yaml#/Meta'
