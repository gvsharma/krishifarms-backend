components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: Sort field. Prefix with `-` for descending (e.g. `-created_at`).
      schema: { type: string, example: "-created_at" }
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date }
    SearchQuery:
      name: q
      in: query
      description: Full-text search query (Telugu and English supported).
      schema: { type: string, minLength: 1 }
    FarmerId:
      name: farmer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FarmId:
      name: farm_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique key for idempotent financial POST requests.
      schema: { type: string, maxLength: 100 }
    XDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: Stable client device identifier (UUID). Used for audit, sessions, and FCM binding.
      schema: { type: string, maxLength: 100 }
    XClientType:
      name: X-Client-Type
      in: header
      required: false
      description: Client channel — mobile, web, or api.
      schema: { type: string, enum: [mobile, web, api], default: api }

  responses:
    BadRequest:
      description: Validation or business rule error
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Invalid request payload", details: { field: "amount" } }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Authentication required" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Missing permission: procurements:create" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Resource not found" }
    Conflict:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Farmer with this code already exists" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: schemas/common.yaml#/ErrorResponse }
          example:
            success: false
            error: { message: "Internal server error" }
