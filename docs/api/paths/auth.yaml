login:
  post:
    tags: [Authentication]
    summary: Login with email or mobile and password
    security: []
    operationId: authLogin
    parameters:
      - $ref: '../schemas/common.yaml#/XDeviceIdHeader'
      - $ref: '../schemas/common.yaml#/XClientTypeHeader'
      - $ref: '../schemas/common.yaml#/XRequestIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Tokens issued
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/TokenAPIResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

firebaseLogin:
  post:
    tags: [Authentication]
    summary: Exchange Firebase phone OTP ID token for CRM JWT
    description: |
      Client completes Firebase Phone Authentication (SMS OTP) and sends the
      Firebase ID token in the Authorization header. Backend verifies the token
      with Firebase Admin SDK, looks up the user by verified phone in PostgreSQL,
      and returns CRM JWT + RBAC. No auto-registration — admin must create the user first.
    security: []
    operationId: authFirebaseLogin
    parameters:
      - name: Authorization
        in: header
        required: true
        description: `Bearer {firebase_id_token}`
        schema:
          type: string
          example: Bearer eyJhbGciOiJSUzI1NiIs...
      - $ref: '../schemas/common.yaml#/XDeviceIdHeader'
      - $ref: '../schemas/common.yaml#/XClientTypeHeader'
      - $ref: '../schemas/common.yaml#/XRequestIdHeader'
    responses:
      '200':
        description: CRM tokens issued
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/TokenAPIResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
      '403':
        description: Phone verified but user not registered in CRM
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '429':
        description: Too many login attempts
      '503':
        description: Firebase not configured on server

refresh:
  post:
    tags: [Authentication]
    summary: Refresh access token
    security: []
    operationId: authRefresh
    parameters:
      - $ref: '../schemas/common.yaml#/XDeviceIdHeader'
      - $ref: '../schemas/common.yaml#/XClientTypeHeader'
      - $ref: '../schemas/common.yaml#/XRequestIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/RefreshRequest'
    responses:
      '200':
        description: New tokens issued
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/TokenAPIResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'

logout:
  post:
    tags: [Authentication]
    summary: Revoke refresh token
    security: []
    operationId: authLogout
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/RefreshRequest'
    responses:
      '200':
        description: Logged out
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/MessageAPIResponse'

me:
  get:
    tags: [Authentication]
    summary: Current user profile with RBAC (mobile)
    operationId: authMe
    responses:
      '200':
        description: Profile and permissions
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  $ref: '../schemas/auth.yaml#/AuthMeResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthorized'
