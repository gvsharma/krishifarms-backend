# Shared list/create/update/delete pattern for platform + master catalogs.
# Full response schemas mirror Python `app/modules/platform/schemas.py` and master_data/financial modules.

villages:
  get:
    tags: [Master Data]
    operationId: listVillages
    summary: List villages
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: page_size
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      - name: district_id
        in: query
        schema: { type: string, format: uuid }
      - name: mandal_id
        in: query
        schema: { type: string, format: uuid }
      - name: district
        in: query
        schema: { type: string }
      - name: mandal
        in: query
        schema: { type: string }
      - name: status
        in: query
        schema: { type: string, enum: [active, inactive] }
      - name: q
        in: query
        schema: { type: string }
        description: Search name, code, mandal, district, pincode
    responses:
      '200': { description: Paginated villages }
  post:
    tags: [Master Data]
    operationId: createVillage
    summary: Create village (auto village_code VIL-####)
    responses:
      '201': { description: Created }

villageSearch:
  get:
    tags: [Master Data]
    operationId: searchVillages
    summary: Search villages by village/mandal/farmer/buyer/crop
    parameters:
      - name: q
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    responses:
      '200': { description: Village search hits }

villageById:
  get:
    tags: [Master Data]
    operationId: getVillage
    summary: Get village by ID
    parameters:
      - name: village_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Village detail }
  patch:
    tags: [Master Data]
    operationId: updateVillage
    summary: Update village
    parameters:
      - name: village_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Updated }
  delete:
    tags: [Master Data]
    operationId: deleteVillage
    summary: Soft-delete village
    parameters:
      - name: village_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Soft-deleted }

villageProfile360:
  get:
    tags: [Master Data]
    operationId: getVillageProfile360
    summary: Village 360° relationship dashboard
    description: >
      Aggregated village hub — summary, KPIs, farmers, procurement, services, vehicles,
      payments, finance, farming, buyers, comments, documents, analytics, timeline, GIS stub, reports.
    parameters:
      - name: village_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Village 360 profile }
      '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

