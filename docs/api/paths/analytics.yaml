analyticsExport:
  post:
    tags: [Analytics]
    operationId: postAnalyticsExport
    summary: Export module KPIs/tables as CSV
    description: |
      Requires `dashboard:read`. Phase 1 returns CSV attachment only
      (Excel/PDF Phase 2). Org from JWT.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [module]
            properties:
              module: { type: string }
              format:
                type: string
                enum: [csv]
                default: csv
              date_from: { type: string, format: date, nullable: true }
              date_to: { type: string, format: date, nullable: true }
              preset: { type: string, nullable: true }
              village_id: { type: string, format: uuid, nullable: true }
              crop_type_id: { type: string, format: uuid, nullable: true }
              farmer_id: { type: string, format: uuid, nullable: true }
              buyer_id: { type: string, format: uuid, nullable: true }
              asset_id: { type: string, format: uuid, nullable: true }
              season: { type: string, nullable: true }
    responses:
      '200':
        description: CSV attachment
        content:
          text/csv:
            schema:
              type: string
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
