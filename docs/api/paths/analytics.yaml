analyticsCatalog:
  get:
    tags: [Analytics]
    operationId: getAnalyticsCatalog
    summary: Analytics hub module catalog (live + scaffold)
    description: |
      Requires `dashboard:read`. Returns 15 hub modules: 4 live (executive,
      operations, procurement, finance) and 11 scaffolds with honest
      data-availability notes. Does not invent weather/inventory/AI KPIs.
    responses:
      '200':
        description: Analytics catalog
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean }
                data:
                  type: object
                  properties:
                    modules:
                      type: array
                      items:
                        type: object
                        required: [id, name, description, status, href, group]
                        properties:
                          id: { type: string }
                          name: { type: string }
                          name_te: { type: string, nullable: true }
                          description: { type: string }
                          status:
                            type: string
                            enum: [live, scaffold]
                          href: { type: string }
                          group: { type: string }
                          missing_sources:
                            type: array
                            items: { type: string }
                    live_count: { type: integer }
                    scaffold_count: { type: integer }
                    data_plane: { type: string }
                    permission: { type: string }
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden

analyticsModuleSummary:
  get:
    tags: [Analytics]
    operationId: getAnalyticsModuleSummary
    summary: Module KPI summary (live or scaffold empty state)
    description: |
      Requires `dashboard:read`. Org from JWT. Cached under
      `analytics:{org}:{module}:summary:{filter_hash}` (TTL 60–300s).
      Money fields are Decimal/NUMERIC — never float fabrication for
      cash book / weather / AI.
    parameters:
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum:
            - executive
            - operations
            - procurement
            - finance
            - farming
            - vehicle
            - village
            - farmer
            - buyer
            - employee
            - service
            - crop-intelligence
            - inventory
            - ai-prediction
            - alerts
      - name: date_from
        in: query
        schema: { type: string, format: date }
      - name: date_to
        in: query
        schema: { type: string, format: date }
      - name: preset
        in: query
        schema:
          type: string
          enum: [today, 7d, 30d, season, custom]
      - name: village_id
        in: query
        schema: { type: string, format: uuid }
      - name: crop_type_id
        in: query
        schema: { type: string, format: uuid }
      - name: farmer_id
        in: query
        schema: { type: string, format: uuid }
      - name: buyer_id
        in: query
        schema: { type: string, format: uuid }
      - name: asset_id
        in: query
        schema: { type: string, format: uuid }
      - name: season
        in: query
        schema: { type: string }
    responses:
      '200':
        description: Module summary with KPIs, series preview, tables, availability
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean }
                data:
                  type: object
                  required: [module, status, filters, kpis]
                  properties:
                    module: { type: string }
                    status:
                      type: string
                      enum: [live, scaffold]
                    kpis:
                      type: array
                      items:
                        type: object
                        required: [id, label, status]
                        properties:
                          id: { type: string }
                          label: { type: string }
                          value: {}
                          unit: { type: string, nullable: true }
                          format: { type: string }
                          status:
                            type: string
                            enum: [live, unavailable, coming_soon, estimate]
                          note: { type: string, nullable: true }
                          drill:
                            type: object
                            nullable: true
                            properties:
                              href: { type: string }
                              label: { type: string, nullable: true }
                    health_score: { type: integer, nullable: true }
                    health_score_method: { type: string, nullable: true }
                    cache_hit: { type: boolean }
                    latency_ms: { type: integer, nullable: true }
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        description: Unknown module

