# Production stack for EC2 — no source bind mounts; nginx host port defaults to 8082 (shared Gamya EC2).
#
# DATABASE_URL comes from .env (copied from application.env). Do not hardcode it under
# `environment:` — that overrides env_file and would ignore Supabase / RDS URLs.
#
# Local Docker Postgres (default): DATABASE_URL host = `postgres` (Compose DNS).
# Supabase: set DATABASE_URL in application.env with ?sslmode=require; after cutover you
# may `docker compose -f infra/docker-compose.prod.yml stop postgres` to free RAM.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishi}
      POSTGRES_DB: krishifarms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi -d krishifarms"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CACHE_PROVIDER: memory
    # DATABASE_URL: from env_file only (Compose `environment` would override .env)
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
