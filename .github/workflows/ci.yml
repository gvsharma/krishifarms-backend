name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly full E2E suite (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EC2_API_HEALTH_URL: http://13.232.200.243:8082/api/v1/health

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  wake-ec2:
    name: Wake shared EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0426cdc00ff15bfe9
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance when stopped
        run: |
          set -euo pipefail
          ID="${EC2_INSTANCE_ID}"
          STATE="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          echo "EC2 ${ID} state=${STATE}"
          if [[ "${STATE}" == "running" ]]; then
            echo "Already running — no action"
            exit 0
          fi
          if [[ "${STATE}" != "stopped" ]]; then
            echo "::warning::Unexpected state ${STATE} — skipping start"
            exit 0
          fi
          echo "Starting ${ID}…"
          aws ec2 start-instances --region "${AWS_REGION}" --instance-ids "${ID}" >/dev/null
          aws ec2 wait instance-running --region "${AWS_REGION}" --instance-ids "${ID}"
          aws ec2 wait instance-status-ok --region "${AWS_REGION}" --instance-ids "${ID}"
          echo "EC2 running"

      - name: Verify API health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -sf --max-time 10 "${EC2_API_HEALTH_URL}" >/dev/null; then
              echo "Health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for docker/nginx (attempt ${attempt}/24)…"
            sleep 10
          done
          echo "::error::EC2 is up but ${EC2_API_HEALTH_URL} not ready — docker may still be starting"
          exit 1

  e2e:
    name: E2E (Playwright)
    needs: [validate, wake-ec2]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
