name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # E2E requires EC2 up — run manually after `Wake shared EC2` or start-shared-ec2.sh
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
